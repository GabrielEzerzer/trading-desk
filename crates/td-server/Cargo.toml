[package]
name = "td-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
clap.workspace = true
getrandom.workspace = true
# Each run's backtests go on a thread pool of its own, so runs never wait for each other's.
rayon.workspace = true
serde.workspace = true
# Exact float parsing: a replayed log must give back the very bars and rates that were fed.
serde_json = { workspace = true, features = ["float_roundtrip"] }
subtle.workspace = true
td-core = { workspace = true, features = ["ts"] }
td-data.workspace = true
td-engine = { workspace = true, features = ["ts"] }
# td-bench writes its datasets and saved runs into fresh temporary directories.
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
ts-rs.workspace = true

[dev-dependencies]
futures-util.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
