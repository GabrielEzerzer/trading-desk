[package]
name = "td-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
td-core.workspace = true
rayon.workspace = true
serde.workspace = true
# float_roundtrip parses every f64 back to the exact value it was written from, so a saved
# result loads bit for bit.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
# TypeScript declarations for the GUI, generated by td-server.
ts = ["dep:ts-rs", "td-core/ts"]

[build-dependencies]
# build.rs hashes each strategy's source file.
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
# The cross-check harness's example downloads and exports its data through td-data.
td-data.workspace = true
tempfile.workspace = true

# Our side of the NautilusTrader cross-check (harness/crosscheck/). Its unit tests run with the
# crate's.
[[example]]
name = "crosscheck"
test = true
