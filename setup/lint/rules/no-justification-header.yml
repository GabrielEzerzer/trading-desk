id: no-justification-header-rust
language: Rust
severity: error
message: "The file header says what the module is for, not why the code is a patch. A word like shortcut, workaround, stopgap, temporary, for now, deliberately or TODO means the reason belongs elsewhere: fix the cause, put the reason in a test, or put the known limit in a GitHub issue."
rule:
  matches: header-rust
  regex: '(?i)\b(short[\s-]?cuts?|works?[\s-]?arounds?|stop[\s-]?gaps?|hacks?|hacky|for\s+now|temporary|temporarily|deliberately|intentionally|on\s+purpose|todo|fixme|xxx|the\s+owner)\b'
---
