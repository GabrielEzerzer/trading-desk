id: layers-rust-fixtures-through-mock
language: Rust
severity: error
message: "A file read with include_str! or include_bytes! from outside its own crate comes from a mock/ folder (mock/bybit/fixtures, gui/app/mock). Move the fixture there, or into this crate's tests/fixtures/."
files:
  - "crates/**"
  - "mock/**"
rule:
  kind: macro_invocation
  regex: '^include_(str|bytes)\s*!\s*\(\s*"(\.\./){2,}'
  not:
    regex: '/mock/'
---
id: layers-gui-shared-stands-alone
language: TypeScript
severity: error
message: "gui/shared is the API types and client that both Electron processes load: it imports nothing from the app, Electron, Node or React. Put process-specific code in gui/app/src/main or gui/app/src/renderer and import @td/shared from there."
files:
  - "gui/shared/src/**"
ignores:
  - "gui/shared/src/**/*.test.ts"
rule:
  kind: string
  regex: '^[''"](electron(/.*)?|node:.*|(fs|path|os|child_process|http|https|net|crypto|url|worker_threads|stream|events)(/.*)?|react|react-dom(/.*)?|\.\./.*)[''"]$'
  inside:
    any:
      - kind: import_statement
      - kind: export_statement
      - kind: arguments
        inside:
          kind: call_expression
          has:
            field: function
            regex: '^(import|require)$'
---
id: layers-gui-renderer-sandboxed-ts
language: TypeScript
severity: error
message: "The renderer runs in the browser sandbox with no Node or Electron. Reach the engine through @td/shared and the preload bridge, and put Node or Electron code in gui/app/src/main."
files:
  - "gui/app/src/renderer/**"
rule:
  kind: string
  regex: '^[''"](electron(/.*)?|node:.*|(fs|path|os|child_process|http|https|net|crypto|url|worker_threads|stream|events)(/.*)?|(\.\./)+(main|preload)(/.*)?)[''"]$'
  inside:
    any:
      - kind: import_statement
      - kind: export_statement
      - kind: arguments
        inside:
          kind: call_expression
          has:
            field: function
            regex: '^(import|require)$'
---
