id: layers-td-core-pure
language: Rust
severity: error
message: "td-core's library code holds the shared types and the tick and lot rounding, and imports no other workspace crate and no file, network or process code. Do the I/O in td-data or in the crate that needs it, and pass the values in."
files:
  - "crates/td-core/src/**"
utils:
  crate-path-root:
    any:
      - inside:
          field: path
          any:
            - kind: scoped_identifier
            - kind: scoped_type_identifier
            - kind: scoped_use_list
            - kind: use_as_clause
      - inside:
          field: name
          any:
            - kind: extern_crate_declaration
            - kind: scoped_identifier
              regex: '^::'
      - inside:
          any:
            - kind: use_declaration
            - kind: use_list
            - kind: use_wildcard
    not:
      inside:
        kind: use_list
        stopBy: end
        inside:
          kind: scoped_use_list
rule:
  any:
    - kind: identifier
      regex: '^(td_engine|td_data|td_orders|td_live|td_server|td_mock_bybit|reqwest|tokio|tokio_tungstenite|axum|hmac)$'
      matches: crate-path-root
    - kind: scoped_identifier
      regex: '^std\s*::\s*(fs|net|process)$'
    - regex: '^(fs|net|process)\b'
      any:
        - kind: identifier
        - kind: scoped_identifier
        - kind: scoped_use_list
        - kind: use_as_clause
        - kind: use_wildcard
      inside:
        kind: use_list
        inside:
          kind: scoped_use_list
          has:
            field: path
            regex: '^std$'
---
id: layers-td-engine-no-venue
language: Rust
severity: error
message: "td-engine runs on the bars and quotes it is given and never fetches data or sends orders. Load data with td-data and send orders with td-orders from td-server or td-live, and pass the results in. Only the cross-check example in crates/td-engine/examples/ downloads through td-data."
files:
  - "crates/td-engine/**"
ignores:
  - "crates/td-engine/examples/**"
utils:
  crate-path-root:
    any:
      - inside:
          field: path
          any:
            - kind: scoped_identifier
            - kind: scoped_type_identifier
            - kind: scoped_use_list
            - kind: use_as_clause
      - inside:
          field: name
          any:
            - kind: extern_crate_declaration
            - kind: scoped_identifier
              regex: '^::'
      - inside:
          any:
            - kind: use_declaration
            - kind: use_list
            - kind: use_wildcard
    not:
      inside:
        kind: use_list
        stopBy: end
        inside:
          kind: scoped_use_list
rule:
  any:
    - kind: identifier
      regex: '^(td_data|td_orders|td_live|td_server|td_mock_bybit|reqwest|tokio|tokio_tungstenite|axum|hmac)$'
      matches: crate-path-root
    - kind: scoped_identifier
      regex: '^std\s*::\s*net$'
    - regex: '^net\b'
      any:
        - kind: identifier
        - kind: scoped_identifier
        - kind: scoped_use_list
        - kind: use_as_clause
        - kind: use_wildcard
      inside:
        kind: use_list
        inside:
          kind: scoped_use_list
          has:
            field: path
            regex: '^std$'
---
