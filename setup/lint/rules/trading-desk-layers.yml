id: layers-mock-bybit-independent
language: Rust
severity: error
message: "td-mock-bybit stands in for the venue and, of the workspace crates, imports td-core only, so it never shares code with the client it tests. Copy the venue's documented behaviour into mock/bybit instead of importing it from td-orders, td-live or another crate."
files:
  - "mock/bybit/**"
utils:
  crate-path-root:
    any:
      - inside:
          field: path
          any:
            - kind: scoped_identifier
            - kind: scoped_type_identifier
            - kind: scoped_use_list
            - kind: use_as_clause
      - inside:
          field: name
          any:
            - kind: extern_crate_declaration
            - kind: scoped_identifier
              regex: '^::'
      - inside:
          any:
            - kind: use_declaration
            - kind: use_list
            - kind: use_wildcard
    not:
      inside:
        kind: use_list
        stopBy: end
        inside:
          kind: scoped_use_list
rule:
  kind: identifier
  regex: '^(td_engine|td_data|td_orders|td_live|td_server)$'
  matches: crate-path-root
