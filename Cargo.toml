[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
td-core = { path = "crates/td-core" }
td-data = { path = "crates/td-data" }
td-engine = { path = "crates/td-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# td-data (#11): history download, the Parquet candle store and the td-data CLI.
arrow = { version = "58", default-features = false }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
parquet = { version = "58", default-features = false, features = ["arrow", "zstd"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "query", "gzip"] }
sha2 = "0.11"
tempfile = "3"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# td-engine
proptest = "1"
rayon = "1"

# td-server: the localhost API (#16) and paper sessions on live feeds (#15).
axum = { version = "0.8.9", features = ["ws", "macros"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
subtle = "2.6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ts-rs = "12"
