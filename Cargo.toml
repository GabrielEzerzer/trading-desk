[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
td-core = { path = "crates/td-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# td-data (#11): history download, the Parquet candle store and the td-data CLI.
arrow = { version = "58", default-features = false }
clap = { version = "4", features = ["derive"] }
parquet = { version = "58", default-features = false, features = ["arrow", "zstd"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "query"] }
sha2 = "0.11"
tempfile = "3"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# td-engine
proptest = "1"
