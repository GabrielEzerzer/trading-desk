[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
td-core = { path = "crates/td-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# td-data (#11): history download, the Parquet candle store and the td-data CLI.
arrow = { version = "58", default-features = false }
clap = { version = "4", features = ["derive"] }
parquet = { version = "58", default-features = false, features = ["arrow", "zstd"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "query"] }
sha2 = "0.11"
tempfile = "3"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# td-engine
proptest = "1"
rayon = "1"

# Live feeds and paper sessions (#15). The same versions and features as Tipping Point.
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
