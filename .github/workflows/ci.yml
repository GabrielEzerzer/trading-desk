# CI for this repo, copied in by D:/code/setup/new-project.py. Rules: D:/code/CLAUDE.md, "Test suites".
# It runs on pushes to branches other than the default and on manual dispatch, so each push starts one run
# and a branch has results before its PR exists.
# The Suite step fails until the first code PR replaces it with the project's own commands.
# Never give this workflow production URLs, real secrets, .env.local or a service_role key.
name: ci

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Suite
        run: |
          echo "::error::No test suite is wired into CI yet. Replace this step with the project's commands."
          exit 1
